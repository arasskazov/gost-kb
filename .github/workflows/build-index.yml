name: Build Index

on:
  push:
    branches:
      - main
    paths:
      - 'standards/**'
      - 'build_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build_index.py
        run: python build_index.py

      - name: Commit updated index files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add INDEX.md GLOSSARY.md llms.txt
          git diff --cached --quiet || git commit -m "chore: rebuild INDEX.md, GLOSSARY.md, llms.txt [skip ci]"
          git push
